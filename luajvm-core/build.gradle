// ── 测试分两层：runCoreTests（纯 JVM）/ runAndroidTests（真机 APK） ─────────────
//   分层判据是「测试需要什么运行时」，不是「代码属于哪个模块」：
//   能在纯 JVM 上诚实判定的一律留在本层（秒级、无设备也能跑、可进 check）；
//   只有真需要 Context/Activity/dexmaker/WebView 的才上 APK（见 docs/GATES.md 分层表）。
tasks.register('runCoreTests') {
    group = 'verification'
    description = '纯 JVM 全量门禁：lua55-debug 对照、官方测试、Java 绑定测试、Java API、并发、各项驻留门禁，及 android 侧合约门禁与 JVM 单测。'
    dependsOn 'lua55DebugTests', 'officialAllTests', 'officialTests', 'luajvmTests',
            'javaApiTests', 'chunkTests', 'contModeTests', 'concurrencyTests', 'internPressureTests',
            'classInitOrderTests', 'globalsRetentionTests', 'ioHandleLeakTests',
            'classLoaderRetentionTests', 'kcacheRetentionTests', 'stackRetentionTests',
            'coroThreadLeakTests', 'coroThreadLeakPlatformTests', 'poolRetentionTests',
            'contSupportOffTests', 'contSupportNoExportTests', 'contSupportOnTests',
            'cclosureMarkTests', 'accessCacheBoundTests', 'methodGroupCacheTests', 'hostCallStackBoundTests',
            'gsubPoolCapTests', 'longLivedGlobalsTests', 'bindFastPathTests', 'loaderCacheTests',
            'coercionScoreTests', 'flatShapeTests', 'coreLayerContractTests',
            // android 侧四个静态门禁（layer/host/threadEntry/baselineProfile）在
            //   luajvm-android 的 test 源集，由其 testDebugUnitTest 经 JUnit 包装执行
            ':luajvm-android:testDebugUnitTest'
}

// android 侧门禁的手动别名（androidGates = runCoreTests 的 android 子集）。
//   runCoreTests 本身已含 android 侧且零漏跑：android 源码未改动时 compile/单测均
//   UP-TO-DATE、三个合约门禁各 1-2s（实测整体 +2s）；改动 android 时这些成本
//   本来就是必须支付的验证。单独跑 android 侧用 androidGates 即可。
tasks.register('androidGates') {
    group = 'verification'
    description = 'android 侧纯 JVM 门禁手动别名：layer/host/threadEntry/baselineProfile 合约 + 平台层单测。'
    dependsOn ':luajvm-android:testDebugUnitTest'
}

check.dependsOn 'runCoreTests'


// java-only: ContSupport 三态门禁（协程第三模式的启用判据）。
//   三态各对应一个真实部署场景，见 ContSupportTest 类注释。
//   第 2 态最关键：类能 Class.forName 到但跨模块调用会失败，若误判 true 则运行期才炸。
tasks.register('contSupportOffTests', JavaExec) {
    group = 'verification'
    description = '无 -Dluajvm.cont：SUPPORTED 须为 false（默认部署走原线程实现）。'
    configureClassDirectoryTest(delegate, 'org.luajvm.test.ContSupportTest')
    jvmArgs('-Dluajvm.contExpect=false')
    stripContFlags(delegate)   // 不受全局 -Pcont 影响：本态就是「没开就必须 false」
}

tasks.register('contSupportNoExportTests', JavaExec) {
    group = 'verification'
    description = '有 -Dluajvm.cont 但无 --add-exports：SUPPORTED 须为 false（等价 Android/ART）。'
    configureClassDirectoryTest(delegate, 'org.luajvm.test.ContSupportTest')
    jvmArgs('-Dluajvm.cont=true', '-Dluajvm.contExpect=false')
    // 本任务的全部意义就是「缺 --add-exports 时必须回落」，等价于 Android/ART 场景。
    //   configureClassDirectoryTest 在 -Pcont=true 时会给所有任务加 --add-exports，
    //   那会让本任务拿到导出、SUPPORTED 变 true 而与期望冲突（实测踩过：跑
    //   runCoreTests -Pcont=true 时本任务 FAILED，但那是门禁自相矛盾、不是回归）。
    //   故在此显式剔除该 flag，使本任务不受全局开关影响。
    stripContFlags(delegate)   // 只剔 --add-exports；-Dluajvm.cont 由上面显式给
    doFirst { jvmArgs = jvmArgs + '-Dluajvm.cont=true' }
}

tasks.register('contSupportOnTests', JavaExec) {
    group = 'verification'
    description = 'flag 与 --add-exports 齐备：SUPPORTED 须为 true，并验 yield 序列与不占线程。'
    configureClassDirectoryTest(delegate, 'org.luajvm.test.ContSupportTest')
    jvmArgs('-Dluajvm.cont=true', '-Dluajvm.contExpect=true',
            '--add-exports', 'java.base/jdk.internal.vm=ALL-UNNAMED')
}

// java-only: Continuation 模式下的协程语义（contSupportOnTests 只验 SUPPORTED 与 yield 序列）。
//   五项：yield/resume、嵌套协程、错误传播、挂起态可被 GC 回收、状态机转移。
//   用例在模式未启用时打印 SKIP 并返回 0，故本任务捕获输出、见 SKIP 即失败——
//   否则 jvmArgs 漏配会让门禁一行不跑还全绿。
tasks.register('contModeTests', JavaExec) {
    group = 'verification'
    description = 'Continuation 模式协程语义：yield/resume、嵌套、错误传播、GC、状态转移。'
    configureClassDirectoryTest(delegate, 'org.luajvm.test.ContinuationModeTest')
    jvmArgs('-Dluajvm.cont=true',
            '--add-exports', 'java.base/jdk.internal.vm=ALL-UNNAMED')
    def captured = new ByteArrayOutputStream()
    standardOutput = new org.apache.tools.ant.util.TeeOutputStream(System.out, captured)
    doLast {
        if (captured.toString().contains('SKIP')) {
            throw new GradleException('contModeTests: Continuation 模式未启用，门禁空转——检查 jvmArgs')
        }
    }
}
