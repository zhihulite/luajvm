// java-only: C 闭包（LUA_VCCL）upvalue 槽的 GC 可见性门禁。
//   propagateOne 的 LUA_VCCL 分支只遍历 gcRefs()，若 LuaCClosure 不覆写它，
//   upvalue[] 里的对象在标记阶段完全不可见 -> 被 sweep 摘除并提前跑 __gc。
tasks.register('cclosureMarkTests', JavaExec) {
    group = 'verification'
    description = '验证 C 闭包 upvalue 槽被 GC 标记（含 Lua 闭包对照组）。'
    configureClassDirectoryTest(delegate, 'org.luajvm.test.CClosureUpvalueMarkTest')
}

// java-only: 宿主侧 callLua 入口的栈回收门禁（成功与错误两条路径）。
//   成功路径：打包成 Varargs 后必须退回 top 并清槽，否则每次宿主调用永久留 nres 个槽，
//   top 单调上涨使 shrinkStackForGc 条件永不成立（栈永不收缩），滞留槽还钉死返回值。
//   错误路径：宿主 catch(LuaError) 后须走 luaD_pcall 恢复段，否则 top/CallInfo 链同样无界。
tasks.register('hostCallStackBoundTests', JavaExec) {
    group = 'verification'
    description = '验证宿主 callLua 入口退回栈（成功/错误两条路径的栈有界 + 返回值可回收）。'
    configureClassDirectoryTest(delegate, 'org.luajvm.test.HostCallStackBoundTest')
}

