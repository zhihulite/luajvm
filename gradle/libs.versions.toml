[versions]
appcompat = "1.8.0"
junit = "4.13.2"
# 1.7.1 存在 bug（issue 435193212 的修复提交 e368eb7c147）：预测性返回取消时
#   恢复动画被直接清除，转场快照与视图状态残留。锁 1.7.0，
#   待上游 1.7.2+ 修复后解除
transition = "1.7.0"
fragment = "1.9.0"
viewpager2 = "1.1.0"
viewpager = "1.1.0"
recyclerview = "1.4.0"
swiperefresh = "1.2.0"
material = "1.14.0"
glide = "5.0.9"
photoview = "2.3.0"
activity = "1.13.0"
agp = "9.3.2"
core = "1.19.0"
splashscreen = "1.2.0"
webkit = "1.17.0"
documentfile = "1.1.0"
preference = "1.2.1"
dexmaker = "2.28.6"
androidx-test-runner = "1.7.0"
androidx-test-rules = "1.7.0"
androidx-test-junit = "1.3.0"

[libraries]
# AndroidX
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-appcompat-resources = { group = "androidx.appcompat", name = "appcompat-resources", version.ref = "appcompat" }
androidx-transition = { group = "androidx.transition", name = "transition", version.ref = "transition" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
androidx-viewpager2 = { group = "androidx.viewpager2", name = "viewpager2", version.ref = "viewpager2" }
androidx-viewpager = { group = "androidx.viewpager", name = "viewpager", version.ref = "viewpager" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
androidx-swiperefresh = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "swiperefresh" }
androidx-core = { group = "androidx.core", name = "core", version.ref = "core"}
androidx-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }

# Google
junit = { module = "junit:junit", version.ref = "junit" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# Third-party
glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }
glide-compiler = { group = "com.github.bumptech.glide", name = "compiler", version.ref = "glide" }
photoview = { module = "com.github.Baseflow:PhotoView", version.ref = "photoview" }

# Activity
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }
androidx-preference = { group = "androidx.preference", name = "preference", version.ref = "preference" }
dexmaker = { module = "com.linkedin.dexmaker:dexmaker", version.ref = "dexmaker" }

# 仪器化测试（只进 androidTest，不随 AAR 发布）
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidx-test-runner" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidx-test-rules" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }