# ── 制品坐标 ────────────────────────────────────────────────────────────────
# luajvm-core / luajvm-android 必须同版本发布：android 以 api 依赖 core，
# 版本错配会让消费方的 classpath 上出现两份不同的 core。
luajvmGroup=io.github.zhihulite
luajvmVersion=1.0.0

# zhihulite/maven-repository 的本地工作副本。默认取同级目录——三个仓库
# （luajvm、material-components-android、maven-repository）并排 clone 时直接可用。
# 换位置或在 CI 上用 -PmavenRepoDir=<路径> 覆盖。
#
# 发布只是往这个目录写文件，随后由该仓库 git push 完成分发。
mavenRepoDir=../maven-repository
